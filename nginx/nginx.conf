events {
    worker_connections 1024;
}

http {
    upstream api_servers {
         server api1:4000;
         server api2:4000;
    }

    server {
        listen 80;

        location /api/ {
            proxy_pass http://api_servers;
        }

        location / {
            proxy_pass http://frontend:5173;
        }
    }
}